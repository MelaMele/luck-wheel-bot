<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የዕድል እሽከርክሪት</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; text-align: center; padding: 20px; margin: 0; }
        .wheel-container { position: relative; width: 280px; height: 280px; margin: 20px auto; }
        .wheel {
            width: 100%; height: 100%; border-radius: 50%; border: 5px solid #d4af37;
            background: conic-gradient(#e74c3c 0deg 36deg, #3498db 36deg 72deg, #2ecc71 72deg 108deg, #f1c40f 108deg 144deg, #9b59b6 144deg 180deg, #1abc9c 180deg 216deg, #e67e22 216deg 252deg, #34495e 252deg 288deg, #27ae60 288deg 324deg, #8e44ad 324deg 360deg);
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
            position: relative; overflow: hidden;
        }
        /* 🔢 በክበቡ ላይ የሚቀመጡ ቁጥሮች ስታይል */
        .wheel-number {
            position: absolute; width: 30px; height: 30px; top: 10px; left: 125px;
            transform-origin: 15px 130px; text-align: center; font-weight: bold;
            font-size: 16px; color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        .pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid #d4af37; z-index: 10; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 350px; margin: 20px auto; }
        .num-btn { background: #1e272e; border: 2px solid #2f3542; color: white; padding: 15px 0; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .num-btn.active { border-color: #d4af37; background: #aa7c11; }
        .room-selector { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .room-btn { background: #2f3542; border: 1px solid #d4af37; color: white; padding: 10px; border-radius: 5px; font-size: 13px; font-weight: bold; }
        .room-btn.selected { background: #d4af37; color: black; }
        #confirm-btn { background: #27ae60; color: white; border: none; padding: 15px; border-radius: 30px; width: 100%; font-size: 18px; font-weight: bold; margin-top: 20px; display: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2 style="color: #d4af37;">🎡 የዕድል እሽከርክሪት</h2>
    <div class="room-selector">
        <button class="room-btn selected" id="r30" onclick="setRoom('30')">🥉 30 ብር</button>
        <button class="room-btn" id="r50" onclick="setRoom('50')">🥈 50 ብር</button>
        <button class="room-btn" id="r100" onclick="setRoom('100')">🥇 100 ብር</button>
    </div>
    
    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
    </div>
    
    <div class="grid" id="grid"></div>
    <button id="confirm-btn" onclick="sendData()">✅ የመረጥኩትን ቁጥር አስመዝግብ</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let selectedRoom = '30'; let selectedNum = null;

        function setRoom(r) {
            selectedRoom = r;
            document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById('r' + r).classList.add('selected');
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('grid'); grid.innerHTML = '';
            const count = selectedRoom === '30' ? 10 : 5;
            
            // 🔄 በመንኮራኩሩ ላይ ቁጥሮቹን በክብ ቅርጽ መደርደር
            const wheel = document.getElementById('wheel');
            wheel.innerHTML = '';
            const angleStep = 360 / count;
            
            for(let i=1; i<=count; i++) {
                // 1. ለመንኮራኩሩ ቁጥር መፍጠር
                const numDiv = document.createElement('div');
                numDiv.className = 'wheel-number';
                numDiv.innerText = i;
                // ቁጥሩን በተገቢው ዲግሪ ማሽከርከር (ወደ መሃል እንዲያይ)
                numDiv.style.transform = `rotate(${(i-1) * angleStep + (angleStep/2)}deg)`;
                wheel.appendChild(numDiv);

                // 2. ከታች የሚጫኑትን ቁልፎች (Grid Buttons) መፍጠር
                const b = document.createElement('button'); 
                b.className = 'num-btn'; 
                b.innerText = i;
                b.onclick = () => {
                    selectedNum = i;
                    document.querySelectorAll('.num-btn').forEach(btn => btn.classList.remove('active'));
                    b.classList.add('active');
                    document.getElementById('confirm-btn').style.display = 'block';
                    
                    // መንኮራኩሩን በዘፈቀደ የማሽከርከር አኒሜሽን
                    const extraDegrees = Math.floor(Math.random() * 360) + 720;
                    wheel.style.transform = `rotate(${extraDegrees}deg)`;
                };
                grid.appendChild(b);
            }
        }

        function sendData() {
            if(!selectedNum) return;
            const data = JSON.stringify({ room: selectedRoom, number: selectedNum });
            tg.sendData(data);
            tg.close();
        }
        
        // መጀመሪያ ገጹ ሲከፈት እንዲሰራ ማድረግ
        renderGrid();
    </script>
</body>
</html>
