name: 🎰 የዕድል መንኮራኩር ቦት አውቶሜሽን

concurrency:
  group: telegram-bot
  cancel-in-progress: true  # 👈 አዲስ ኮድ ሲመጣ የድሮውን በራሱ ጊዜ ይገድለዋል! Conflict መከላከያ

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-telegram-bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: 📦 ላይብረሪዎችን መጫን
      run: |
        python -m pip install --upgrade pip
        pip install aiogram
    - name: 🚀 ቦቱን ማንቀሳቀስ
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: python bot.py
